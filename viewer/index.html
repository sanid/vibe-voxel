<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Berlin Vibe Voxel</title>
    <style>
      :root { color-scheme: light dark; --ink: #1d1b19; --paper: #f4f1ea; --accent: #b5462f; }
      @media (prefers-color-scheme: dark) { :root { --ink: #ece8df; --paper: #1b1a18; --accent: #e07a5f; } }
      html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink);
        font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
      canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #panel { position: fixed; left: 16px; bottom: 16px; padding: 12px 14px; border-radius: 10px;
        background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(6px);
        box-shadow: 0 2px 16px rgb(0 0 0 / 0.12); min-width: 280px; max-width: calc(100vw - 32px); }
      #panel h1 { font-size: 15px; margin: 0 0 8px; font-weight: 600; }
      #panel label { display: grid; grid-template-columns: 52px 1fr; align-items: center; gap: 8px; margin: 6px 0; }
      #panel input[type="range"] { width: 100%; accent-color: var(--accent); }
      #panel input[type="date"] { font: inherit; background: transparent; color: inherit; border: 1px solid currentColor;
        border-radius: 6px; padding: 2px 6px; opacity: 0.85; }
      #panel button { font: inherit; border: 1px solid currentColor; background: transparent; color: inherit;
        border-radius: 6px; padding: 4px 10px; cursor: pointer; margin-top: 4px; }
      #status { font-size: 12px; opacity: 0.75; margin-top: 6px; min-height: 1em; }
      #sun { font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="panel">
      <h1>Berlin, Alexanderplatz</h1>
      <label>Time <input id="hour" type="range" min="0" max="24" step="0.25" value="11" /></label>
      <label>Date <input id="date" type="date" value="2026-06-21" /></label>
      <div id="sun"></div>
      <button id="reset" type="button">Reset view</button>
      <div id="status">loading…</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
